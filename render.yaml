# Render deploy for the MCQ admin panel (Flask)
# The Tkinter quiz UI cannot run on a web server — it runs on the
# Raspberry Pi's touch display. Only the admin panel is deployed here.
services:
  - type: web
    name: mcq-learning-system
    env: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    plan: free
